<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="96 96 832 832">
  <!-- Kelime Ustası favicon: uygulama ikonunun kenar boşluğu kırpılmış hali. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BE02A"/>
      <stop offset="1" stop-color="#3F9B00"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E4D00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Gövde -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <!-- Arkadaki kart -->
  <g transform="rotate(-11 512 540)">
    <rect x="300" y="290" width="424" height="520" rx="56" fill="#E6FFD2" opacity="0.75"/>
  </g>

  <!-- Öndeki kart -->
  <g transform="rotate(6 512 540)" filter="url(#cardShadow)">
    <rect x="300" y="290" width="424" height="520" rx="56" fill="#FFFFFF"/>
    <!-- Kıvılcım -->
    <path d="M512 352
             C 524 432, 548 456, 628 468
             C 548 480, 524 504, 512 584
             C 500 504, 476 480, 396 468
             C 476 456, 500 432, 512 352 Z"
          fill="url(#gold)"/>
    <!-- Kelime / tanım satırları -->
    <rect x="368" y="642" width="288" height="36" rx="18" fill="#58CC02"/>
    <rect x="404" y="706" width="216" height="28" rx="14" fill="#D7E7CC"/>
  </g>
</svg>
