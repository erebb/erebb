name: Mac uygulaması

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # yalnızca v* etiketinde Release oluşturmak için

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-e2e:
    name: Safari motorunda (WebKit) uçtan uca test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: WebKit'i kur
        run: npx playwright install webkit

      - name: Üretim derlemesi
        run: npm run build

      - name: Uçtan uca test (WebKit)
        run: npm run e2e
        env:
          E2E_BROWSER: webkit
          E2E_SCREENSHOTS: e2e-screenshots

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-ekran-goruntuleri
          path: e2e-screenshots
          if-no-files-found: ignore

  build-macos:
    name: .dmg derle (Intel + Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Bağımlılıklar
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Uygulamayı derle
        run: npm run app:build:universal

      - name: Paketi doğrula
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          shopt -s nullglob
          apps=("$BUNDLE"/macos/*.app)
          dmgs=("$BUNDLE"/dmg/*.dmg)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::.app bulunamadı"; ls -R "$BUNDLE"; exit 1; }
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::.dmg bulunamadı"; ls -R "$BUNDLE"; exit 1; }
          APP="${apps[0]}"
          DMG="${dmgs[0]}"

          echo "== Uygulama: $APP"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$BIN")
          echo "Mimariler: $ARCHS"
          [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]] || { echo "::error::Evrensel ikili değil: $ARCHS"; exit 1; }

          echo "== İmza"
          codesign -dv "$APP" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt || { echo "::error::Ad-hoc imza yok"; exit 1; }
          codesign --verify --deep --strict "$APP"

          echo "== Info.plist"
          plutil -p "$APP/Contents/Info.plist" | tee plist.txt
          grep -q '"CFBundleDevelopmentRegion" => "tr"' plist.txt || { echo "::error::Türkçe bölge birleştirilmemiş"; exit 1; }
          grep -q '"LSMinimumSystemVersion" => "11.0"' plist.txt || { echo "::error::Asgari macOS sürümü yok"; exit 1; }

          echo "== DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"

          # Artefakt adı ASCII olsun; dosya adındaki Türkçe karakter bazı indirme araçlarında bozuluyor.
          mkdir -p out
          cp "$DMG" "out/KelimeUstasi-${GITHUB_REF_NAME//\//-}-universal.dmg"
          echo "dmg=$(ls out/*.dmg)" >> "$GITHUB_OUTPUT"

      - name: Açılış testi
        shell: bash
        run: |
          set -euo pipefail
          # .dmg'yi bağla, uygulamayı başlat, birkaç saniye ayakta kaldığını doğrula.
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "${{ steps.verify.outputs.dmg }}"
          APP=$(ls -d "$MNT"/*.app)
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          "$APP/Contents/MacOS/$BIN" > app.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "Uygulama 8 saniye sonra hâlâ çalışıyor (PID $PID)."
            kill "$PID"
          else
            echo "::error::Uygulama açılışta kapandı"; cat app.log; exit 1
          fi
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: KelimeUstasi-mac
          path: out/*.dmg
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg
          generate_release_notes: true
