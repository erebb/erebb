name: Mac uygulaması

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # testler ve derleme yeşilse sürümü (Release) yayımlamak için

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-e2e:
    name: Safari motorunda (WebKit) uçtan uca test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: WebKit'i kur
        run: npx playwright install webkit

      - name: Üretim derlemesi
        run: npm run build

      - name: Uçtan uca test (WebKit)
        run: npm run e2e
        env:
          E2E_BROWSER: webkit
          E2E_SCREENSHOTS: e2e-screenshots

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-ekran-goruntuleri
          path: e2e-screenshots
          if-no-files-found: ignore

  build-macos:
    name: .dmg derle (Intel + Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Bağımlılıklar
        run: npm ci

      - name: Sürümü belirle
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Her commit'te yeni sürüm: package.json'daki ana.ara sürüm + çalışma numarası
          # (ör. 1.1.57). Uygulama açılışta GitHub'daki son sürümle kendi sürümünü karşılaştırır.
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="$BASE.$GITHUB_RUN_NUMBER"
            if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF_NAME" == main || "$GITHUB_REF_NAME" == claude/gamified-learning-app-hr183v ) ]]; then
              PUBLISH=true
            fi
          fi
          npm pkg set version="$VERSION"
          echo "Sürüm: $VERSION (yayımla: $PUBLISH)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Uygulamayı derle
        shell: bash
        env:
          # Güncelleme imza anahtarı (depo ayarlarında secret). Yoksa uygulama yine derlenir;
          # yalnızca otomatik kurulabilen güncelleme paketi üretilmez.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          EXTRA=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            EXTRA=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY yok — imzalı güncelleme paketi üretilmeyecek"
          fi
          # hdiutil, macOS runner'larında ara sıra "Resource busy" ile düşer; o durumda
          # yalnızca paketleme adımını yeniden dene (derlemeyi baştan yapmadan).
          if ! npx tauri build --target universal-apple-darwin "${EXTRA[@]}"; then
            echo "::warning::Derleme/paketleme düştü; paketleme yeniden deneniyor"
            sleep 10
            npx tauri bundle --bundles app,dmg --target universal-apple-darwin "${EXTRA[@]}"
          fi

      - name: Paketi doğrula
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          shopt -s nullglob
          apps=("$BUNDLE"/macos/*.app)
          dmgs=("$BUNDLE"/dmg/*.dmg)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::.app bulunamadı"; ls -R "$BUNDLE"; exit 1; }
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::.dmg bulunamadı"; ls -R "$BUNDLE"; exit 1; }
          APP="${apps[0]}"
          DMG="${dmgs[0]}"

          echo "== Uygulama: $APP"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$BIN")
          echo "Mimariler: $ARCHS"
          [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]] || { echo "::error::Evrensel ikili değil: $ARCHS"; exit 1; }

          echo "== İmza"
          codesign -dv "$APP" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt || { echo "::error::Ad-hoc imza yok"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "== Info.plist"
          plutil -p "$APP/Contents/Info.plist" | tee plist.txt
          grep -q '"CFBundleDevelopmentRegion" => "tr"' plist.txt || { echo "::error::Türkçe bölge birleştirilmemiş"; exit 1; }
          grep -q '"LSMinimumSystemVersion" => "11.0"' plist.txt || { echo "::error::Asgari macOS sürümü yok"; exit 1; }

          echo "== DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"

          # Dosya adı ASCII olsun: GitHub, boşluk ve Türkçe karakter içeren Release dosyalarını
          # yeniden adlandırıyor; bazı indirme araçları da bozuyor.
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="KelimeUstasi-${VERSION}-mac.dmg"
          mkdir -p out
          cp "$DMG" "out/$NAME"
          echo "dmg=out/$NAME" >> "$GITHUB_OUTPUT"

          # İmzalı güncelleme paketi (yalnızca anahtar varsa üretilir) + latest.json.
          tgz=("$BUNDLE"/macos/*.app.tar.gz)
          if [ ${#tgz[@]} -eq 1 ] && [ -f "${tgz[0]}.sig" ]; then
            cp "${tgz[0]}" out/KelimeUstasi.app.tar.gz
            cp "${tgz[0]}.sig" out/KelimeUstasi.app.tar.gz.sig
            node -e '
              const fs = require("fs");
              const [version, sigFile, repo] = process.argv.slice(1);
              const platform = {
                signature: fs.readFileSync(sigFile, "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/v${version}/KelimeUstasi.app.tar.gz`,
              };
              const latest = {
                version,
                notes: `Kelime Ustası ${version}`,
                pub_date: new Date().toISOString(),
                platforms: { "darwin-aarch64": platform, "darwin-x86_64": platform },
              };
              fs.writeFileSync("out/latest.json", JSON.stringify(latest, null, 2));
            ' "$VERSION" out/KelimeUstasi.app.tar.gz.sig "$GITHUB_REPOSITORY"
            echo "== latest.json"; cat out/latest.json
          else
            echo "::notice::Güncelleme paketi yok (imza anahtarı tanımlı değil)"
          fi
          ls -lh out

      - name: Açılış testi
        shell: bash
        run: |
          set -euo pipefail
          # .dmg'yi bağla, uygulamayı başlat, ayakta kaldığını doğrula. Menü, yapılandırma
          # ya da gömülü dosyalardaki bir sorun açılışta paniğe yol açar ve burada yakalanır.
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "${{ steps.verify.outputs.dmg }}"
          APP=$(ls -d "$MNT"/*.app)
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          "$APP/Contents/MacOS/$BIN" > app.log 2>&1 &
          PID=$!
          sleep 15
          mkdir -p launch
          # En iyi çaba: ekran kaydı izni yoksa boş görüntü çıkabilir; testi bundan düşürme.
          screencapture -x launch/acilis.png || true
          if kill -0 "$PID" 2>/dev/null; then
            echo "Uygulama 15 saniye sonra hâlâ çalışıyor (PID $PID)."
            kill "$PID"
          else
            echo "::error::Uygulama açılışta kapandı"; cat app.log; exit 1
          fi
          cat app.log || true
          hdiutil detach "$MNT"

      - name: Açılış ekran görüntüsü
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acilis-ekran-goruntusu
          path: launch
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: KelimeUstasi-mac
          path: out/*.dmg
          if-no-files-found: error
          compression-level: 0 # .dmg zaten sıkıştırılmış

      - name: Yayımlanacak dosyalar
        if: steps.ver.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Sürümü yayımla
    # Yalnızca WebKit testleri ve Mac derlemesi yeşilse: açılışta güncellemeyi denetleyen
    # uygulamalar (içerik ve uygulama) yalnızca test edilmiş sürümü alır.
    needs: [webkit-e2e, build-macos]
    if: needs.build-macos.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-macos.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          {
            echo "## Bu sürümde"
            echo
            echo "${COMMIT_MSG:-Kelime Ustası $VERSION}" | head -n 1
            echo
            echo "## Kurulum ve güncelleme"
            echo
            echo "- **Zaten kuruluysa:** uygulama açılışta bu sürümü kendisi bulur; yeni içerik otomatik yüklenir, uygulama güncellemesi indirilip kurulur (ilerlemen korunur)."
            echo "- **İlk kurulum:** aşağıdaki **\`KelimeUstasi-$VERSION-mac.dmg\`** dosyasını indir, aç ve **Kelime Ustası**'nı **Uygulamalar** klasörüne sürükle. Tek dosya Apple Silicon ve Intel Mac'lerde çalışır (macOS 11+)."
            echo "- **İlk açılış (bir kez):** Uygulama Apple geliştirici sertifikasıyla imzalı değil. macOS 15+: açmayı dene → **Bitti** → **Sistem Ayarları › Gizlilik ve Güvenlik** → **Yine de Aç**. macOS 11–14: Control-tık › **Aç**. Ya da Terminal: \`xattr -dr com.apple.quarantine /Applications/Kelime*.app\`"
          } > notes.md
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Kelime Ustası $VERSION" --notes-file notes.md --latest
          fi

      - name: Eski sürümleri temizle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Her commit bir sürüm yayımlar; en yeni 5 sürüm kalsın.
          gh release list --repo "$REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            while read -r tag; do
              echo "Siliniyor: $tag"
              gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes || true
            done
