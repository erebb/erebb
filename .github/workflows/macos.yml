name: Mac uygulaması

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # yalnızca v* etiketinde Release oluşturmak için

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-e2e:
    name: Safari motorunda (WebKit) uçtan uca test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: WebKit'i kur
        run: npx playwright install webkit

      - name: Üretim derlemesi
        run: npm run build

      - name: Uçtan uca test (WebKit)
        run: npm run e2e
        env:
          E2E_BROWSER: webkit
          E2E_SCREENSHOTS: e2e-screenshots

      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-ekran-goruntuleri
          path: e2e-screenshots
          if-no-files-found: ignore

  build-macos:
    name: .dmg derle (Intel + Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Etiket ile uygulama sürümü aynı mı
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME#v}" = "$APP_VERSION" ] || {
            echo "::error::Etiket $GITHUB_REF_NAME ama package.json sürümü $APP_VERSION"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Bağımlılıklar
        run: npm ci

      - name: Uygulamayı derle
        shell: bash
        run: |
          # hdiutil, macOS runner'larında ara sıra "Resource busy" ile düşer; o durumda
          # yalnızca .dmg paketleme adımını yeniden dene (derlemeyi baştan yapmadan).
          if ! npm run app:build:universal; then
            echo "::warning::Derleme/paketleme düştü; .dmg paketlemesi yeniden deneniyor"
            sleep 10
            npx tauri bundle --bundles dmg --target universal-apple-darwin
          fi

      - name: Paketi doğrula
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          shopt -s nullglob
          apps=("$BUNDLE"/macos/*.app)
          dmgs=("$BUNDLE"/dmg/*.dmg)
          [ ${#apps[@]} -eq 1 ] || { echo "::error::.app bulunamadı"; ls -R "$BUNDLE"; exit 1; }
          [ ${#dmgs[@]} -eq 1 ] || { echo "::error::.dmg bulunamadı"; ls -R "$BUNDLE"; exit 1; }
          APP="${apps[0]}"
          DMG="${dmgs[0]}"

          echo "== Uygulama: $APP"
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$BIN")
          echo "Mimariler: $ARCHS"
          [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]] || { echo "::error::Evrensel ikili değil: $ARCHS"; exit 1; }

          echo "== İmza"
          codesign -dv "$APP" 2>&1 | tee codesign.txt
          grep -q 'Signature=adhoc' codesign.txt || { echo "::error::Ad-hoc imza yok"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "== Info.plist"
          plutil -p "$APP/Contents/Info.plist" | tee plist.txt
          grep -q '"CFBundleDevelopmentRegion" => "tr"' plist.txt || { echo "::error::Türkçe bölge birleştirilmemiş"; exit 1; }
          grep -q '"LSMinimumSystemVersion" => "11.0"' plist.txt || { echo "::error::Asgari macOS sürümü yok"; exit 1; }

          echo "== DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"

          # Dosya adı ASCII olsun: GitHub, boşluk ve Türkçe karakter içeren Release dosyalarını
          # yeniden adlandırıyor; bazı indirme araçları da bozuyor.
          VERSION=$(node -p "require('./package.json').version")
          REF="${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then NAME="KelimeUstasi-${VERSION}-mac.dmg"; else NAME="KelimeUstasi-${VERSION}-${REF}-mac.dmg"; fi
          mkdir -p out
          cp "$DMG" "out/$NAME"
          echo "dmg=out/$NAME" >> "$GITHUB_OUTPUT"

      - name: Açılış testi
        shell: bash
        run: |
          set -euo pipefail
          # .dmg'yi bağla, uygulamayı başlat, ayakta kaldığını doğrula. Menü, yapılandırma
          # ya da gömülü dosyalardaki bir sorun açılışta paniğe yol açar ve burada yakalanır.
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "${{ steps.verify.outputs.dmg }}"
          APP=$(ls -d "$MNT"/*.app)
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          "$APP/Contents/MacOS/$BIN" > app.log 2>&1 &
          PID=$!
          sleep 15
          mkdir -p launch
          # En iyi çaba: ekran kaydı izni yoksa boş görüntü çıkabilir; testi bundan düşürme.
          screencapture -x launch/acilis.png || true
          if kill -0 "$PID" 2>/dev/null; then
            echo "Uygulama 15 saniye sonra hâlâ çalışıyor (PID $PID)."
            kill "$PID"
          else
            echo "::error::Uygulama açılışta kapandı"; cat app.log; exit 1
          fi
          cat app.log || true
          hdiutil detach "$MNT"

      - name: Açılış ekran görüntüsü
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acilis-ekran-goruntusu
          path: launch
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: KelimeUstasi-mac
          path: out/*.dmg
          if-no-files-found: error
          compression-level: 0 # .dmg zaten sıkıştırılmış

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kelime Ustası ${{ github.ref_name }}
          files: out/*.dmg
          fail_on_unmatched_files: true
          body: |
            ## Mac'e kurulum

            1. Aşağıdaki **`KelimeUstasi-…-mac.dmg`** dosyasını indir. Tek dosya hem Apple Silicon (M1–M4) hem Intel Mac'lerde çalışır; en az macOS 11 gerekir.
            2. `.dmg`'yi aç ve **Kelime Ustası**'nı **Uygulamalar** klasörüne sürükle. (İlk açılıştan önce mutlaka Uygulamalar'a kopyala.)
            3. **İlk açılış (bir kez):** Uygulama Apple geliştirici sertifikasıyla imzalı olmadığından macOS bir uyarı gösterir.
               - **macOS 15 ve sonrası:** Uygulamayı açmayı dene, uyarıda **Bitti**'ye bas → **Sistem Ayarları › Gizlilik ve Güvenlik** → aşağıdaki **Yine de Aç** → parolanı gir.
               - **macOS 11–14:** Uygulamalar'da Kelime Ustası'na **Control-tık (sağ tık) › Aç** → **Aç**.
               - Ya da Terminal'de: `xattr -dr com.apple.quarantine /Applications/Kelime*.app`

            Ayrıntılar ve güncelleme notları için depodaki README'ye bak.
